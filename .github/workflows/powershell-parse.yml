name: PowerShell parse check

on:
  push:
  pull_request:

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every .ps1 and .psm1 under tools/
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path tools -Recurse -Include *.ps1,*.psm1
          $anyError = $false
          foreach ($f in $files) {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
              if ($errors.Count -gt 0) {
                  $anyError = $true
                  Write-Host "FAIL: $($f.FullName)"
                  foreach ($e in $errors) {
                      Write-Host "    line $($e.Extent.StartLineNumber): $($e.Message)"
                  }
              } else {
                  Write-Host "ok: $($f.FullName)"
              }
          }
          if ($anyError) { exit 1 }
